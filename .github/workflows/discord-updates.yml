name: Discord update feed

# Announces every published release (the join kit players must download) in Discord, then opens a
# thread on that announcement and posts the release's "## Update summary" section in it (the
# change summary Bibidi used to paste by hand). The announcement goes through the channel webhook;
# the thread and its posts need a bot (DISCORD_BOT_TOKEN) with View Channels, Send Messages,
# Create Public Threads, Send Messages in Threads and Read Message History in that channel. With
# no bot token the announcement still posts and the summary is skipped with a log line.
# The push feed is off by default because the only pushes here are README syncs; uncomment the
# push block to post commits too. "Run workflow" in the Actions tab posts the latest release
# again (thread included), which is the way to test the webhook and the bot.
on:
  release:
    types: [published]
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Post to Discord
        run: node .github/scripts/discord-notify.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_USERNAME: 'Confluence Updates'
          # The server emblem, served from this repo (assets/emblem.png).
          DISCORD_AVATAR_URL: 'https://raw.githubusercontent.com/${{ github.repository }}/main/assets/emblem.png'
          # Optional: a role to ping on releases, as <@&ROLE_ID>, or @here / @everyone. Blank = no ping.
          DISCORD_MENTION: ''
          # Push feed grouping: "" flat, "." by top-level folder, "plugins" by folder under plugins/.
          PLUGIN_ROOT: ''
